<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }
    h1 {
      margin-top: 100px;
      font-size: 3em;
      text-shadow: 2px 2px 5px #ff4d6d;
    }
    p {
      font-size: 1.5em;
      margin-top: 20px;
    }
    .heart {
      position: absolute;
      font-size: 2em;
      animation: floatUp 5s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
    button {
      margin-top: 40px;
      padding: 15px 25px;
      font-size: 1.2em;
      border: none;
      border-radius: 30px;
      background: #ff4d6d;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #e6004c;
    }
  </style>
</head>
<body>
  <h1>💖 For My Special Girl 💖</h1>
  <img src="12.jpg" alt="" height="200px" width="200px">
  <p>You are the most beautiful part of my life.<br>
     Every heartbeat whispers your name... 💕</p>
  <button onclick="showMessage()">Click for Surprise</button>

  <script>
    // floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 2) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
    setInterval(createHeart, 500);

    // surprise message
    function showMessage() {
      alert("I love you more than words can say 💕\nAlways and Forever 😘");
    }
  </script>
</body>
</html>
